<svg xmlns="http://w3.org" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Shield Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shield Metallic Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Secure Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Grid Pattern for Network/Filter Theme -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <rect width="800" height="800" fill="url(#cyberGrid)" />

  <!-- Outer Firewall / Filter Ring (Data Nodes) -->
  <g opacity="0.25">
    <circle cx="400" cy="400" r="280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="16 12" />
    <circle cx="400" cy="400" r="240" fill="none" stroke="#0284c7" stroke-width="1" />
  </g>

  <!-- Main Security Shield (The Secure Filter) -->
  <g filter="url(#glow)">
    <!-- Base Shield Shape -->
    <path d="M 400,180 
             C 480,180 560,150 580,200 
             C 600,350 560,520 400,620 
             C 240,520 200,350 220,200 
             C 240,150 320,180 400,180 Z" 
          fill="url(#shieldGrad)" 
          stroke="#0c4a6e" 
          stroke-width="8" 
          stroke-linejoin="round" />

    <!-- Inner Shield Highlight Contour -->
    <path d="M 400,205 
             C 465,205 535,180 550,220 
             C 565,340 530,490 400,580 
             C 270,490 235,340 250,220 
             C 265,180 335,205 400,205 Z" 
          fill="none" 
          stroke="#7dd3fc" 
          stroke-width="3" 
          opacity="0.5" />
  </g>

  <!-- Unlocked Network / Bypassing Data Stream Geometric Paths -->
  <g opacity="0.85">
    <!-- Left to Right Passing Node -->
    <path d="M 150,400 L 320,400 L 360,440 L 440,440" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="150" cy="400" r="6" fill="#38bdf8" />
    
    <!-- Right to Left Passing Node -->
    <path d="M 650,400 L 480,400 L 440,360 L 360,360" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="650" cy="400" r="6" fill="#38bdf8" />
  </g>

  <!-- Secure Core: The Unlocked Lock & Checkmark Symbol -->
  <g transform="translate(0, 10)">
    <!-- Unlocked Shackle (Represents the Unblocker Feature) -->
    <path d="M 350,350 L 350,290 C 350,250 380,220 420,220 C 460,220 480,250 480,290" 
          fill="none" 
          stroke="#4ade80" 
          stroke-width="14" 
          stroke-linecap="round" 
          filter="url(#glow)"/>
    
    <!-- Central Shield Emblem / Lock Body -->
    <circle cx="400" cy="410" r="75" fill="url(#coreGrad)" stroke="#166534" stroke-width="4" />
    
    <!-- Secure Checkmark (Represents Safety & Success) -->
    <path d="M 365,410 L 390,435 L 440,380" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Decorative Outer Status Lights -->
  <circle cx="400" cy="110" r="5" fill="#22c55e" filter="url(#glow)" />
  <circle cx="375" cy="110" r="4" fill="#22c55e" opacity="0.5" />
  <circle cx="425" cy="110" r="4" fill="#22c55e" opacity="0.5" />
</svg>
